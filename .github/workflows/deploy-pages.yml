name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Distribution Bundles
        run: npm run build

      - name: Prepare GitHub Pages Site Directory
        run: |
          mkdir -p _site _site/docs _site/assets
          cp demo/index.html _site/index.html
          cp demo/logo.png _site/logo.png
          cp dist/iframe-shield.min.js _site/iframe-shield.min.js
          cp docs/index.html _site/docs/index.html
          cp docs/logo.png _site/docs/logo.png
          cp dist/iframe-shield.min.js _site/docs/iframe-shield.min.js
          cp -r assets/* _site/assets/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
